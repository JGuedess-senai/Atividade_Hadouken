<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="_css/style.css">
    <title>Document</title>
</head>

<body>
    <div class="videopl">
        <h1>Player de Vídeo controlado por JS</h1>
        <video id="player" width="450" height="300" controls="controls" autoplay="autoplay">
            <source src="_media/hadouken.mp4" type="video/mp4">
        </video>
        <br><br>
        <div>
            <button onclick="playPause()">Play/Pause</button>
            <button onclick="makeBig()">Ampliar</button>
            <button onclick="makeSmall()">Reduzir</button>
            <button onclick="makeNormal()">Tamanho Normal</button>
        </div>
        <br>
        <div>
            <button onclick="telaCheia()">Tela Cheia</button>
            <button onclick="aumentarVolume()">Volume +</button>
            <button onclick="diminuirVolume()">Volume -</button>
            <button onclick="mutar()">mutar</button>
            <button onclick="desmutar()">desmutar</button>
        </div>
    </div>

    <script src="_javascript/main.js"></script>
</body>

</html>
